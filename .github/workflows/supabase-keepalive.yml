name: Supabase Keep Alive

on:
  # schedule:
  #   # Toutes les 5 jours à 8h UTC — Supabase pause après 7 jours d'inactivité
  #   - cron: '0 8 */5 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/events?select=id&limit=1" \
            -o /dev/null -w "%{http_code}"
